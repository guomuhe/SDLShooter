name: Build WebAssembly + Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install emsdk
        run: |
          git clone https://github.com/emscripten-core/emsdk.git ${{ runner.temp }}/emsdk
          cd ${{ runner.temp }}/emsdk
          ./emsdk install latest
          ./emsdk activate latest
          echo "$PWD" >> $GITHUB_PATH
          echo "EMSCRIPTEN_ROOT=$PWD/upstream/emscripten" >> $GITHUB_ENV
          echo "$PWD/upstream/emscripten" >> $GITHUB_PATH
          echo "$PWD/node/current/bin" >> $GITHUB_PATH

      - name: Verify em++
        run: em++ --version

      - name: Build WebAssembly
        run: |
          mkdir -p build-web
          cd build-web
          em++ \
            -O2 -std=c++17 \
            -s USE_SDL=2 \
            -s USE_SDL_IMAGE=2 \
            -s USE_SDL_MIXER=2 \
            -s USE_SDL_TTF=2 \
            -s SDL2_IMAGE_FORMATS='["png"]' \
            -s SDL2_MIXER_FORMATS='["ogg","wav"]' \
            -s SDL2_TTF_BUILD_ICU=OFF \
            -s DEFAULT_TO_CXX=1 \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s INITIAL_MEMORY=100MB \
            -s TOTAL_MEMORY=512MB \
            -s FORCE_FILESYSTEM=1 \
            -s EXPORTED_RUNTIME_METHODS='["ccall","cwrap"]' \
            --preload-file ../assets@assets \
            -o index.html \
            ../src/main.cpp \
            ../src/Game.cpp \
            ../src/Scene.cpp \
            ../src/SceneTitle.cpp \
            ../src/SceneMain.cpp \
            ../src/SceneEnd.cpp \
            ../src/SceneHelp.cpp \
            ../src/AssetLoader.cpp \
            ../src/assets_embed.cpp
          ls -la

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
